appId: app.kasboek
productName: Kasboek
copyright: Copyright © 2026 Kasboek
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
# better-sqlite3-multiple-ciphers ships prebuilt Node-API binaries for every platform, so nothing
# is compiled and installers can be built on any OS.
npmRebuild: false
asarUnpack:
  - resources/**
  - '**/*.node'
# Electron security fuses, set at packaging time.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: build/icon.ico
  files:
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux}*'
  # 64-bit only. MSI for managed/standard installs, NSIS .exe as a friendly per-user installer.
  target:
    - target: msi
      arch: [x64, arm64]
    - target: nsis
      arch: [x64, arm64]
  artifactName: Kasboek-${version}-win-${arch}.${ext}
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kasboek
  upgradeCode: 7f3c2a1e-4b5d-4c8e-9a6f-2d1b0e9c8a74
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kasboek
  # Keep user data on uninstall: it holds the encrypted database.
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.icns
  # One app for Intel and Apple Silicon. The database's per-arch binaries are loaded by arch at
  # runtime, so they are kept as-is instead of being merged.
  x64ArchFiles: '**/better-sqlite3-multiple-ciphers/prebuilds/darwin-*.node'
  files:
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{win32,linux}*'
  category: public.app-category.finance
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [universal]
  artifactName: Kasboek-${version}-mac.${ext}

linux:
  icon: build/icons
  files:
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{win32,darwin}*'
  category: Finance
  synopsis: Simple, local-first budgeting
  maintainer: Kasboek
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  artifactName: Kasboek-${version}-${arch}.${ext}
