appId: app.kasboek
productName: Kasboek
copyright: Copyright © 2026 Kasboek
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
  - '**/*.node'
# Electron security fuses, set at packaging time.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Kasboek-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kasboek
  # Keep user data on uninstall: it holds the encrypted database.
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.icns
  category: public.app-category.finance
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [universal]
  artifactName: Kasboek-${version}-mac.${ext}

linux:
  icon: build/icons
  category: Finance
  synopsis: Simple, local-first budgeting
  maintainer: Kasboek
  target: [AppImage, deb]
  artifactName: Kasboek-${version}-${arch}.${ext}
