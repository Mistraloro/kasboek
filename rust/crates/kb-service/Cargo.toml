[package]
name = "kb-service"
version = "0.0.0"
description = "AppService: the seam between the native screens and the core (operations by name, events), with a fixture and a kb-core implementation"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
kb-core.workspace = true
kb-crypto.workspace = true
kb-db.workspace = true
kb-oseal = { path = "../kb-oseal" }
kb-session.workspace = true
rustls.workspace = true
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
ureq.workspace = true
zeroize.workspace = true
