[package]
name = "kb-session"
version = "0.0.0"
description = "Kasboek account and session: unlock, lock, throttle, 2FA, recovery, account.json, erase/restore, Electron safeStorage decoder"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The dev driver of the parity suite (rust/parity/session.spec.ts); it is not built by default and never shipped.
parity = []

[[bin]]
name = "kb-session-cli"
path = "src/bin/kb-session-cli.rs"
required-features = ["parity"]

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
base64.workspace = true
hex.workspace = true
hmac.workspace = true
kb-crypto.workspace = true
kb-db.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
