[package]
name = "kb-core"
version = "0.0.0"
description = "Kasboek core: the operation registry, dispatch, validation and the business logic of the operations"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
# `String.prototype.localeCompare` of the TypeScript core: root collation, Unicode-3.0 licence (insights.rs).
icu_collator = "2"
kb-db.workspace = true
kb-import.workspace = true
kb-rules = { path = "../kb-rules" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
# `new URL()` of the provider address checks (insight_plan.rs).
url = "2"

[dev-dependencies]
# The contract test counts the operations the other crates serve (kb-service depends on this crate: a dev-dependency cycle is fine).
kb-service.workspace = true
kb-session.workspace = true
tempfile.workspace = true
