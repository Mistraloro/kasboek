[package]
name = "kb-pdf"
version = "0.0.0"
description = "PDF statements: a pure-Rust text reader (hayro) with limits, memory cap and reader process, lines and cells, table and block statement reading, the text selection for the assistant (src/core/pdf, src/main/pdf, parts of src/core/pdf-plan.ts)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The dev driver of the parity suite (rust/parity/pdf.spec.ts); it is not built by default and never shipped.
parity = []

[[bin]]
name = "kb-pdf-cli"
path = "src/bin/kb-pdf-cli.rs"
required-features = ["parity"]

# The reader process against the real binary (needs the dev driver): cargo test -p kb-pdf --features parity
[[test]]
name = "process"
required-features = ["parity"]

# `read_guarded` exists only for tests and the dev driver.
[[test]]
name = "reader"
required-features = ["parity"]

[dependencies]
# Pinned: the Device trait changed between 0.7 and 0.9. No embedded CJK CMaps (pdf.js, as extract.ts calls it, has no cMapUrl either).
hayro-interpret = { version = "=0.9.0", default-features = false, features = ["embed-fonts"] }
hayro-syntax = "=0.9.0"
kb-import.workspace = true
kb-rules = { path = "../kb-rules" }
kurbo = "0.13"
regex = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
skrifa = "0.49"
unicode-normalization.workspace = true

[dev-dependencies]
flate2.workspace = true
