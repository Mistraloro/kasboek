# Spike B (UI): Slint port of the Lock screen and the Overview page. Standalone project, not part of any workspace.
[package]
name = "kasboek-ui-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }
serde_json = "1"
png = "0.17"

# Device prompts (Windows Hello, Touch ID) and the process creation time. Not built on Linux.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"

[build-dependencies]
slint-build = "1.19"

[features]
# Other renderers, compared in the README: `cargo build --release --features femtovg` / `--features skia`.
femtovg = ["slint/renderer-femtovg"]
skia = ["slint/renderer-skia"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
