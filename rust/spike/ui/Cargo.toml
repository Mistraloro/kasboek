# Spike B (UI): Slint port of the Lock screen and the Overview page. Standalone project, not part of any workspace.
[package]
name = "kasboek-ui-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
serde_json = "1"
png = "0.17"

[build-dependencies]
slint-build = "1.19"

[features]
# Other renderers, compared in the README: `cargo build --release --features femtovg` / `--features skia`.
femtovg = ["slint/renderer-femtovg"]
skia = ["slint/renderer-skia"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
