# Cargo workspace of the native Rust port (docs/rust-port-plan.md). The spikes under spike/ keep their own workspaces.
[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.97"
publish = false

# Shared dependency versions. The ones used by the spikes carry the same requirement strings as there.
[workspace.dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["functions", "cache"] }
argon2 = "0.5"
aes-gcm = "0.10"
aes = "0.8"
unicode-normalization = "0.1"
base64 = "0.22"
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
cc = "1"
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
flate2 = "1"
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }
subtle = "2"
thiserror = "2"
# The one blocking HTTP client (ECB rates, assistant providers, updater, WebDAV; plan section 11.2 O0). TLS is rustls with the
# `ring` provider and the operating system's trust store (`platform-verifier`); no bundled root list (its licence is not on the
# allow-list of deny.toml), no tokio, no aws-lc. Proxies come from the HTTPS_PROXY / ALL_PROXY variables and, on Windows, the
# registry (`win-system-proxy`); PAC files are not read.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
kb-crypto = { path = "crates/kb-crypto" }
kb-db = { path = "crates/kb-db" }
kb-core = { path = "crates/kb-core" }
kb-import = { path = "crates/kb-import" }
kb-service = { path = "crates/kb-service" }
kb-session = { path = "crates/kb-session" }

# rusqlite links sqlite3mc instead of plain SQLite: the vendored engine sits in a package that is named like the crate
# it replaces (see crates/kb-sqlite3mc-sys/VENDOR.md).
[patch.crates-io]
libsqlite3-sys = { path = "crates/kb-sqlite3mc-sys" }

# A panic aborts the process and makes the binaries smaller. The one place that must answer a panic is the PDF reader
# process, which does it from a panic hook (kb-pdf `run_reader_process`) that runs before the abort; tests unwind.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Argon2id with the real cost (128 MiB, 3 passes) is far too slow unoptimised; tests run it.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
