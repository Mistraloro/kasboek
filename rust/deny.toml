# cargo-deny configuration of the native workspace (run by .github/workflows/rust-ci.yml: cargo deny --manifest-path rust/Cargo.toml check).
# The app is GPL-3.0-only, so every dependency licence must be GPL-3.0 compatible. Vulnerabilities and licence violations fail the
# build; unmaintained crates only warn (the workflow passes -W unmaintained, the setting below makes them visible) and so do yanked releases.

[graph]
# All six release targets, so that platform-specific dependencies are checked on every runner.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# The RustSec advisory database (the default). Vulnerabilities always fail.
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "warn"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "GPL-3.0-only",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
