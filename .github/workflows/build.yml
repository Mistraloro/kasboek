name: Build installers

# Builds 64-bit installers on real machines for each OS:
#   Windows: .msi and .exe (x64 + ARM64)   macOS: universal .dmg   Linux: AppImage + .deb (x64 + ARM64)
# Run by hand: a test build (Actions artifacts, kept 90 days), or tick "Publish as a release".
# Push a tag like v0.9.0, or run with "Publish as a release": a permanent GitHub Release for the
# version in package.json, with every installer attached.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish as a release (version from package.json)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to exact commits (the comment shows the version). Dependabot proposes updates
# as pull requests (.github/dependabot.yml), so a moved tag can never change what runs here.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:i18n
      # Without an Apple Developer ID the app is ad-hoc signed (required on Apple Silicon);
      # set CSC_LINK / CSC_KEY_PASSWORD secrets to sign properly.
      - name: Build installers
        shell: bash
        run: |
          # An empty CSC_LINK would be read as a file path: drop signing settings that aren't set.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          extra=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then extra="--config.mac.identity=-"; fi
          npm run ${{ matrix.dist }} -- --publish never $extra
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasboek-${{ runner.os }}
          path: |
            release/*/*.msi
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi
          echo "TAG=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          # Creates the tag on the built commit if it doesn't exist yet; fails if the release exists.
          gh release create "$TAG" $(find dist -type f) \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kasboek ${TAG#v}" \
            --notes-file .github/release-notes.md
