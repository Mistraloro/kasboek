name: Build installers

# Builds 64-bit installers on real machines for each OS:
#   Windows: .msi and .exe (x64 + ARM64)   macOS: universal .dmg   Linux: AppImage + .deb (x64 + ARM64)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:i18n
      # Without an Apple Developer ID the app is ad-hoc signed (required on Apple Silicon);
      # set CSC_LINK / CSC_KEY_PASSWORD secrets to sign properly.
      - run: npm run ${{ matrix.dist }} -- --publish never ${{ (runner.os == 'macOS' && !secrets.CSC_LINK) && '--config.mac.identity=-' || '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: kasboek-${{ runner.os }}
          path: |
            release/*/*.msi
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error
