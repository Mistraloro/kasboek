# The design system (rust/crates/kb-ui): builds the component gallery on Windows, Linux and macOS, uploads it, and on
# Windows reads its accessibility tree with UI Automation (informational: a runner has no screen reader).
name: Rust UI (kb-ui)

on:
  push:
    paths:
      - 'rust/crates/kb-ui/**'
      - '.github/workflows/rust-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    name: Gallery ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, exe: kb-ui-gallery.exe }
          - { name: linux-x64, os: ubuntu-latest, exe: kb-ui-gallery }
          - { name: macos-arm64, os: macos-latest, exe: kb-ui-gallery }
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - name: Tests
        run: cargo test -p kb-ui
      - name: Build the gallery
        run: cargo build --release -p kb-ui
      - name: Stills of every case (light and dark)
        shell: bash
        run: |
          mkdir -p stills
          for theme in light dark; do
            for c in $(target/release/${{ matrix.exe }} --list-cases); do
              target/release/${{ matrix.exe }} --shot "$c" "$theme" "stills/$c-$theme.png"
            done
          done
      - name: UI Automation dump (informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          mkdir uia
          foreach ($case in 'button','input','password','segmented','tabs') {
            & crates\kb-ui\tools\uia-dump.ps1 -Exe "$PWD\target\release\kb-ui-gallery.exe" -Case $case -OutFile "uia\uia-$case.txt" -HoldMs 12000 -TabCount 6
            Write-Host "uia-dump $case exit code: $LASTEXITCODE"
          }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: kb-ui-gallery-${{ matrix.name }}
          path: |
            rust/target/release/${{ matrix.exe }}
            rust/stills
            rust/uia
          if-no-files-found: warn
